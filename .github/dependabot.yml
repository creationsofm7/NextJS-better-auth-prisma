version: 2
updates:
  # 1️⃣ Update npm (Node.js / Next.js) dependencies
  - package-ecosystem: "npm"
    directory: "/" # Root directory where package.json is located
    schedule:
      interval: "weekly" # You can use daily, weekly, or monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
        # Optional: avoid major Next.js version bumps automatically

